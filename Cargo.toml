[package]
name = "ccat"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# File type detection by magic bytes (pure Rust)
infer = "0.19"

# Markdown parsing
pulldown-cmark = "0.13"

# Syntax highlighting for code blocks
syntect = { version = "5", default-features = false, features = ["default-onig"] }

# Terminal colors
termcolor = "1"

# .docx reading
docx-rs = "0.4"

# Image rendering in terminal (kitty, sixel, fallback)
viuer = { version = "0.11", features = ["print-file"] }

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

# Gzip decompression
flate2 = "1"

# For docx Color value extraction
serde_json = "1"

# ELF parsing + architecture detection
object = "0.39"

# x86/x86_64 disassembly
iced-x86 = "1.21"

# Diff computation and ANSI output
similar = "3"
console = "0.16"

# PDF text extraction
pdf-extract = "0.8"

# Archive listing
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"

# Audio/Video metadata
lofty = "0.24"

# Lightweight regex for sed substitution
regex-lite = "0.1"

# Shell completion generation
clap_complete = "4"
