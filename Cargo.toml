[package]
name = "ccat"
version = "0.3.5"
edition = "2024"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# File type detection by magic bytes (pure Rust)
infer = "0.19"

# Markdown parsing
pulldown-cmark = "0.13"

# Syntax highlighting for code blocks
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Terminal colors
termcolor = "1"

# .docx reading
docx-rs = "0.4"

# Image rendering in terminal (kitty, sixel, fallback)
viuer = { version = "0.11", features = ["print-file"] }

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

# Gzip decompression
flate2 = "1"

# For docx Color value extraction
serde_json = "1"

# ELF parsing + architecture detection
object = "0.39"

# x86/x86_64 disassembly
iced-x86 = "1.21"

# Diff computation and ANSI output
similar = "3"
console = "0.16"

# PDF text extraction — use lopdf directly (more reliable than pdf-extract)
lopdf = "0.34"

# Archive listing
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
# Additional archive decompression
brotli = "7"
xz2 = "0.1"
zstd = "0.13"

# Audio/Video metadata
lofty = "0.24"

# Lightweight regex for sed substitution
regex-lite = "0.1"

# Config file support (TOML deserialization + XDG paths)
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

# Shell completion generation
clap_complete = "4"
atty = "0.2.14"
temp-env = "0.3.6"

# YAML parsing for --schema mode
serde_yaml = "0.9"

# QR code generation
qrcode = "0.14"

[dev-dependencies]
syntect = "5"
tempfile = "3"
