name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (source tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release
        run: cargo build --release

      - name: Build source tarball
        run: |
          pkgname=ccat-rs
          version=${{ github.event.release.tag_name }}
          version=${version#v}
          git archive --format=tar.gz --prefix=$pkgname-$version/ -o $pkgname-$version.tar.gz HEAD

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/ccat dist/
          cp completions/ccat.bash completions/_ccat completions/ccat.fish ccat.1 dist/ 2>/dev/null || true
          cd dist
          tar czf ../ccat-x86_64-unknown-linux-gnu.tar.gz *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          gh release upload "$tag" ccat-x86_64-unknown-linux-gnu.tar.gz --clobber
          gh release upload "$tag" "ccat-rs-$version.tar.gz" --clobber

  release-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation dependencies (Windows)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ccat.exe dist/
          cd dist
          7z a ../ccat-x86_64-pc-windows-gnu.zip *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          gh release upload "$tag" ccat-x86_64-pc-windows-gnu.zip --clobber

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: release-linux
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA256 of source tarball
        id: sha
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          tarball="ccat-rs-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout AUR repository
        uses: actions/checkout@v4
        with:
          repository: ssh://aur@aur.archlinux.org/ccat-rs.git
          path: aur
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Update PKGBUILD
        working-directory: aur
        run: |
          ver=${{ steps.sha.outputs.version }}
          sha=${{ steps.sha.outputs.sha256 }}
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=('[^']*')/sha256sums=('$sha')/" PKGBUILD
          sed -i "s|/download/v[^/]*/|/download/v$ver/|" PKGBUILD

      - name: Update .SRCINFO
        working-directory: aur
        run: makepkg --printsrcinfo > .SRCINFO

      - name: Commit and push
        working-directory: aur
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.sha.outputs.version }}"
          git push
