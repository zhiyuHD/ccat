name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (source tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release
        run: cargo build --release

      - name: Build source tarball
        run: |
          pkgname=ccat-rs
          version=${{ github.event.release.tag_name }}
          version=${version#v}
          git archive --format=tar.gz --prefix=$pkgname-$version/ -o $pkgname-$version.tar.gz HEAD

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/ccat dist/
          cp completions/ccat.bash completions/_ccat completions/ccat.fish ccat.1 dist/ 2>/dev/null || true
          cd dist
          tar czf ../ccat-x86_64-unknown-linux-gnu.tar.gz *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          gh release upload "$tag" ccat-x86_64-unknown-linux-gnu.tar.gz --clobber
          gh release upload "$tag" "ccat-rs-$version.tar.gz" --clobber

  release-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation dependencies (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release
        if: always()
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        if: success()
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ccat.exe dist/
          cd dist
          7z a ../ccat-x86_64-pc-windows-gnu.zip *
          cd ..

      - name: Upload release assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          gh release upload "$tag" ccat-x86_64-pc-windows-gnu.zip --clobber

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: release-linux
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4
        with:
          repository: zhiyuHD/ccat
          path: repo

      - name: Checkout AUR package source
        uses: actions/checkout@v4
        with:
          repository: zhiyuHD/ccat-aur
          path: aur

      - name: Compute SHA256 of source tarball
        id: sha
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          tarball="repo/ccat-rs-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare PKGBUILD with updated version
        run: |
          ver=${{ steps.sha.outputs.version }}
          sha=${{ steps.sha.outputs.sha256 }}
          cp aur/PKGBUILD PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=('[^']*')/sha256sums=('$sha')/" PKGBUILD
          sed -i "s|/download/v[^/]*/|/download/v$ver/|" PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ccat-rs
          pkgbuild: PKGBUILD
          commit_username: github-actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          updpkgsums: false
