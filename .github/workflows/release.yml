name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (source tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release
        run: cargo build --release

      - name: Build source tarball
        run: |
          pkgname=ccat-rs
          version=${{ github.event.release.tag_name }}
          version=${version#v}
          git archive --format=tar.gz --prefix=$pkgname-$version/ -o $pkgname-$version.tar.gz HEAD

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/ccat dist/
          cp completions/ccat.bash completions/_ccat completions/ccat.fish ccat.1 dist/ 2>/dev/null || true
          cd dist
          tar czf ../ccat-x86_64-unknown-linux-gnu.tar.gz *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          gh release upload "$tag" ccat-x86_64-unknown-linux-gnu.tar.gz --clobber
          gh release upload "$tag" "ccat-rs-$version.tar.gz" --clobber

  release-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation dependencies (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release
        if: always()
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        if: success()
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ccat.exe dist/
          cd dist
          7z a ../ccat-x86_64-pc-windows-gnu.zip *
          cd ..

      - name: Upload release assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          gh release upload "$tag" ccat-x86_64-pc-windows-gnu.zip --clobber

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: release-linux
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4

      - name: Download source tarball and compute SHA256
        id: sha
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          curl -sL "https://github.com/zhiyuHD/ccat/archive/refs/tags/v$version.tar.gz" -o source.tar.gz
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        run: |
          ver=${{ steps.sha.outputs.version }}
          sha=${{ steps.sha.outputs.sha256 }}
          cat > PKGBUILD << EOF
# Maintainer: Zhiyu Wang <zhiyuxl@outlook.com>
# Maintainer: LuoTianyi_arm64 <2153585992@qq.com>
# Contributor: Crush <crush@ccat.dev>

pkgname=ccat-rs
pkgver=$ver
pkgrel=1
pkgdesc="Universal file viewer — markdown, docx, images, PDF, audio, video, JSON, YAML, logs, ELF disasm, diff, gz, archives"
arch=('x86_64' 'aarch64')
url="https://github.com/zhiyuHD/ccat"
license=('MIT')
depends=('gcc-libs' 'oniguruma')
makedepends=('cargo' 'pkg-config')
source=("ccat-rs-\$pkgver.tar.gz::https://github.com/zhiyuHD/ccat/releases/download/v\$pkgver/ccat-rs-\$pkgver.tar.gz")
sha256sums=('$sha')

build() {
  cd "\$srcdir/ccat-rs-\$pkgver"
  export CARGO_BUILD_JOBS=\$(nproc)
  export RUSTONIG_SYSTEM_LIBONIG=1
  cargo build --release
}

check() {
  cd "\$srcdir/ccat-rs-\$pkgver"
  export RUSTONIG_SYSTEM_LIBONIG=1
  cargo test --release --frozen
}

package() {
  cd "\$srcdir/ccat-rs-\$pkgver"
  install -Dm755 target/release/ccat "\$pkgdir/usr/bin/ccat"
  install -Dm644 completions/ccat.bash "\$pkgdir/usr/share/bash-completion/completions/ccat"
  install -Dm644 completions/_ccat "\$pkgdir/usr/share/zsh/site-functions/_ccat"
  install -Dm644 completions/ccat.fish "\$pkgdir/usr/share/fish/vendor_completions.d/ccat.fish"
  install -Dm644 ccat.1 "\$pkgdir/usr/share/man/man1/ccat.1"
}
EOF

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ccat-rs
          pkgbuild: PKGBUILD
          commit_username: github-actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
