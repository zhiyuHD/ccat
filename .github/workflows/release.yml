name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build source tarball (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pkgname=ccat-rs
          version=${{ github.event.release.tag_name }}
          version=${version#v}
          git archive --format=tar.gz --prefix=$pkgname-$version/ -o $pkgname-$version.tar.gz HEAD

      - name: Package Linux binary
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ccat dist/
          cp completions/ccat.bash completions/_ccat completions/ccat.fish ccat.1 dist/ 2>/dev/null || true
          cd dist
          tar czf ../ccat-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ccat.exe dist/
          cd dist
          7z a ../ccat-${{ matrix.target }}.zip *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          gh release upload "$tag" ccat-${{ matrix.target }}.${{ matrix.archive }} --clobber
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            version=${tag#v}
            gh release upload "$tag" "ccat-rs-$version.tar.gz" --clobber
          fi
