name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (source tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release
        run: cargo build --release

      - name: Build source tarball
        run: |
          pkgname=ccat-rs
          version=${{ github.event.release.tag_name }}
          version=${version#v}
          git archive --format=tar.gz --prefix=$pkgname-$version/ -o $pkgname-$version.tar.gz HEAD

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/ccat dist/
          cp completions/ccat.bash completions/_ccat completions/ccat.fish ccat.1 dist/ 2>/dev/null || true
          cd dist
          tar czf ../ccat-x86_64-unknown-linux-gnu.tar.gz *
          cd ..

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          version=${tag#v}
          gh release upload "$tag" ccat-x86_64-unknown-linux-gnu.tar.gz --clobber
          gh release upload "$tag" "ccat-rs-$version.tar.gz" --clobber

  release-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation dependencies (Windows)
        run: |
          # Use mingw from prebuilt Ubuntu package manager with retries
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 && break
            sleep 5
          done
          which x86_64-w64-mingw32-gcc 2>/dev/null || echo "::warning::mingw not available after retries"

      - name: Build release
        if: always()
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        if: success()
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ccat.exe dist/
          cd dist
          7z a ../ccat-x86_64-pc-windows-gnu.zip *
          cd ..

      - name: Upload release assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event.release.tag_name }}
          gh release upload "$tag" ccat-x86_64-pc-windows-gnu.zip --clobber

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: release-linux
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4

      - name: Download source tarball from release assets and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh release download "${{ github.event.release.tag_name }}" --pattern "ccat-rs-$version.tar.gz"
          echo "sha256=$(sha256sum "ccat-rs-$version.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        run: |
          ver=${{ steps.sha.outputs.version }}
          sha=${{ steps.sha.outputs.sha256 }}
          sed "s/^pkgver=.*/pkgver=$ver/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=('[^']*')/sha256sums=('$sha')/" .github/workflows/aur-pkgbuild.base > PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: ccat-rs
          pkgbuild: PKGBUILD
          commit_username: github-actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
